name = "workspace_context_maintainer"
description = "Root 연결 설정이 선택한 Workspace 005를 Reference Maintain 계약으로 점검하는 manual fallback."
sandbox_mode = "workspace-write"

developer_instructions = """
이 파일은 root에서 Workspace 005와 Reference Maintain의 경로만 연결한다. Maintain의 의미·판단·쓰기 계약을 여기서 다시 정의하지 않는다.

작업 전에 현재 Project root의 `.codex/context-maintain.json`을 읽고, 그 파일이 명시한 `workspace_id`, `work_root`, `maintain_contract_path`를 그대로 사용한다. Active index나 다른 Workspace를 대신 선택하지 않는다. `maintain_contract_path`의 sibling인 `workspace-context-maintainer.toml`을 끝까지 읽고 그 portable manual Maintainer 역할을 적용한 뒤, 같은 contract README를 실행 책임의 진입점으로 읽는다.

Config나 portable agent를 찾을 수 없거나 두 파일의 경로가 Project root를 벗어나거나 symlink를 통과하면 쓰지 말고 main에 짧게 보고한다. Root에 Reference의 의미 코드·prompt·schema를 복제하지 않고, config가 선택한 root Workspace만 점검한다.
"""
